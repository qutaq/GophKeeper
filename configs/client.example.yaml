# Example client config (~/.gophkeeper/config.yaml)
# TLS is always required; for local/dev use a self-signed cert + ca_file.
server_address: localhost:50051
data_dir: ""  # default: ~/.gophkeeper
tls:
  ca_file: ""              # custom CA to trust server cert (recommended for self-signed)
  cert_file: ""            # optional client cert (mTLS)
  key_file: ""             # optional client key (mTLS)
  insecure_skip_verify: false  # only for local/dev self-signed without a CA
