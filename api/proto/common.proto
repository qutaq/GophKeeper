syntax = "proto3";

package gophkeeper.v1;

option go_package = "github.com/qutaq/gophkeeper/internal/proto;gophkeeperv1";

import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "GophKeeper API";
    version: "1.0";
    description: "gRPC API for private data vault with multi-device sync.";
  };
  schemes: HTTPS;
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "Bearer";
      value: {
        type: TYPE_API_KEY;
        in: IN_HEADER;
        name: "Authorization";
        description: "JWT access token. Format: Bearer <token>";
      }
    }
  };
};

// DataType enumerates supported private data kinds.
enum DataType {
  DATA_TYPE_UNSPECIFIED = 0;
  DATA_TYPE_CREDENTIALS = 1;
  DATA_TYPE_TEXT = 2;
  DATA_TYPE_BINARY = 3;
  DATA_TYPE_CARD = 4;
  DATA_TYPE_OTP = 5;
}

// User is a registered account (no secrets in the wire model).
message User {
  string id = 1;
  string login = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

// Item is a private data record. Payload is already E2E-encrypted by the client.
message Item {
  string id = 1;
  string owner_id = 2;
  DataType type = 3;
  bytes encrypted_data = 4;
  map<string, string> metadata = 5;
  int64 version = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool deleted = 8;
}
